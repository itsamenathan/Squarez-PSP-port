<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squarez</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #ccc;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #screen {
      image-rendering: pixelated;
      width: min(100vw, calc((100vh - 28px) * 480 / 272));
      aspect-ratio: 480 / 272;
      background: #000;
      box-shadow: 0 0 40px rgba(40, 90, 200, 0.35);
    }
    .hint {
      font-size: 12px;
      color: #667;
      margin-top: 6px;
      height: 16px;
    }
    .error {
      color: #f66;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="480" height="272"></canvas>
  <div class="hint">Arrows/WASD move &middot; Shift/Z turbo &middot; X slow &middot; Space grenade/revive &middot; C rage &middot; Esc pause/back &middot; Enter select &middot; gamepads supported</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
